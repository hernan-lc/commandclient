import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Mojang'
            url = 'https://libraries.minecraft.net/'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'fabric-loom' version '1.7.4' apply false
}

rootProject.name = 'commandapi'

include 'common'

// versions.json is the single source of truth: every entry becomes a Gradle
// module at versions/<id>. Adding a Minecraft target needs no change here.
def versionsFile = file('versions.json')
def versionSpecs = new JsonSlurper().parse(versionsFile).versions

versionSpecs.each { id, spec ->
    def dir = file("versions/${id}")
    if (!dir.directory) {
        throw new GradleException("versions.json declares '${id}' but ${dir} does not exist. " +
                "See docs/ADDING_VERSION.md.")
    }
    include "versions:${id}"
    project(":versions:${id}").projectDir = dir
}
