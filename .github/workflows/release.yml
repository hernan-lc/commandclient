name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish every supported version
    runs-on: ubuntu-latest
    # One place decides which tag is being released: a published release, a
    # manual dispatch, or the tag that was pushed.
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Always build the tagged source. A manual dispatch must not publish
          # artifacts built from the branch that happened to trigger it.
          ref: ${{ env.TAG }}

      # Every JDK any target needs to build, taken from versions.json.
      - name: Collect required JDKs
        id: jdks
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("versions.json"))
          jdks = sorted({int(spec["buildJava"]) for spec in data["versions"].values()})
          print("list<<EOF")
          for jdk in jdks:
              print(jdk)
          print("EOF")
          print("from_env=" + ",".join(f"JAVA_HOME_{jdk}_X64" for jdk in jdks))
          print("mod_version=" + data["modVersion"])
          print("target_count=" + str(len(data["versions"])))
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdks.outputs.list }}

      - uses: gradle/actions/setup-gradle@v6

      # Checked before the ~3 minute build so a mistake surfaces in seconds.
      - name: Check the tag matches versions.json
        env:
          MOD_VERSION: ${{ steps.jdks.outputs.mod_version }}
        run: |
          # What has to match is the version, because that is what names the
          # JARs. The "v" prefix is cosmetic: v1.5.0 and V1.5.0 are the same
          # release, so one leading prefix character is stripped before
          # comparing.
          case "$TAG" in
            [vV]*) TAG_VERSION="${TAG:1}" ;;
            *) TAG_VERSION="$TAG" ;;
          esac
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error title=Tag/version mismatch::tag $TAG does not match modVersion \
          $MOD_VERSION in versions.json. This build produces JARs named \
          commandapi-$MOD_VERSION+mc<version>.jar, so it can only publish release \
          v$MOD_VERSION. Either move the release onto that tag (git tag -f v$MOD_VERSION \
          <commit> && git push -f origin v$MOD_VERSION) or, if $TAG_VERSION is the version \
          you want to release, set modVersion to $TAG_VERSION in versions.json, run \
          ./gradlew buildAllVersions versionTable, commit, then tag that commit."
            exit 1
          fi
          echo "tag $TAG matches modVersion $MOD_VERSION"

      # A release must not be published if any configured target fails, so this
      # builds them all in one run rather than a matrix.
      - name: Build all ${{ steps.jdks.outputs.target_count }} versions
        run: ./gradlew buildAllVersions collectServerArtifact -Porg.gradle.java.installations.fromEnv=${{ steps.jdks.outputs.from_env }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify example client credential scope
        run: node --test docs/example-client.test.js

      - name: Verify artifacts against versions.json
        run: python3 scripts/verify-builds.py

      - name: Verify standalone server artifact
        run: python3 scripts/verify-plugin.py build/server-distributions/commandapi-server-*.jar

      - name: Build release notes
        run: |
          python3 scripts/generate-version-table.py
          {
            echo "## Command API $TAG"
            echo
            echo "One JAR per supported Minecraft version. Drop the matching file into your \`mods/\` folder."
            echo "Fabric Loader is required; Fabric API is not."
            echo "Install ONE server JAR in plugins/: legacy for 1.16.5-1.20.6 (Java 8 bytecode), modern for 1.21-26.x (Java 21 bytecode). Use the Java required by your server. Folia is unsupported."
            echo "Runtime evidence is listed separately; compilation does not verify in-game behavior."
            echo
            sed -n '/^| Minecraft | Tier /,/^$/p' docs/VERSIONS.md
            echo "Columns: Artifact = built here, CI = verified by GitHub Actions, Runtime = exercised in game."
            echo
            echo "\`manifest.json\` lists the same artifacts in machine-readable form."
          } > release-notes.md
          cat release-notes.md

      # Creating a release in the GitHub UI also creates its tag, which triggers
      # this workflow - so by the time it runs, the release may already exist.
      # Upload into it rather than failing on a name clash.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(build/distributions/*.jar build/distributions/manifest.json build/server-distributions/*.jar build/server-distributions/server-manifest.json)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; updating it in place"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Command API $TAG" --notes-file release-notes.md
          else
            echo "creating release $TAG"
            gh release create "$TAG" \
              --title "Command API $TAG" \
              --notes-file release-notes.md \
              "${ASSETS[@]}"
          fi

          echo "published $(ls build/distributions/*.jar | wc -l) JARs to $TAG"
          gh release view "$TAG" --json assets --jq '.assets[].name'
