name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish every supported version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every JDK any target needs to build, taken from versions.json.
      - name: Collect required JDKs
        id: jdks
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("versions.json"))
          jdks = sorted({int(spec["buildJava"]) for spec in data["versions"].values()})
          print("list<<EOF")
          for jdk in jdks:
              print(jdk)
          print("EOF")
          print("from_env=" + ",".join(f"JAVA_HOME_{jdk}_X64" for jdk in jdks))
          print("mod_version=" + data["modVersion"])
          print("target_count=" + str(len(data["versions"])))
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdks.outputs.list }}

      - uses: gradle/actions/setup-gradle@v6

      # Checked before the ~3 minute build so a mistake surfaces in seconds.
      - name: Check the tag matches versions.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          EXPECTED="v${{ steps.jdks.outputs.mod_version }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error title=Tag/version mismatch::tag $TAG does not match modVersion \
          in versions.json (expected $EXPECTED). The JARs this build produces would be named \
          ${{ steps.jdks.outputs.mod_version }}, not ${TAG#v}. To release ${TAG#v}: set modVersion \
          to ${TAG#v} in versions.json, run ./gradlew buildAllVersions versionTable, commit, then \
          move the $TAG tag onto that commit (git tag -f $TAG && git push -f origin $TAG)."
            exit 1
          fi
          echo "tag $TAG matches modVersion ${{ steps.jdks.outputs.mod_version }}"

      # A release must not be published if any configured target fails, so this
      # builds them all in one run rather than a matrix.
      - name: Build all ${{ steps.jdks.outputs.target_count }} versions
        run: ./gradlew buildAllVersions -Porg.gradle.java.installations.fromEnv=${{ steps.jdks.outputs.from_env }}

      - name: Verify artifacts against versions.json
        run: python3 scripts/verify-builds.py

      - name: Build release notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          python3 scripts/generate-version-table.py
          {
            echo "## Command API $TAG"
            echo
            echo "One JAR per supported Minecraft version. Drop the matching file into your \`mods/\` folder."
            echo "Fabric Loader is required; Fabric API is not."
            echo
            sed -n '/^| Minecraft | Tier /,/^$/p' docs/VERSIONS.md
            echo "Columns: Artifact = built here, CI = verified by GitHub Actions, Runtime = exercised in game."
            echo
            echo "\`manifest.json\` lists the same artifacts in machine-readable form."
          } > release-notes.md
          cat release-notes.md

      # Creating a release in the GitHub UI also creates its tag, which triggers
      # this workflow - so by the time it runs, the release may already exist.
      # Upload into it rather than failing on a name clash.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ASSETS=(build/distributions/*.jar build/distributions/manifest.json)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; updating it in place"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Command API $TAG" --notes-file release-notes.md
          else
            echo "creating release $TAG"
            gh release create "$TAG" \
              --title "Command API $TAG" \
              --notes-file release-notes.md \
              "${ASSETS[@]}"
          fi

          echo "published $(ls build/distributions/*.jar | wc -l) JARs to $TAG"
          gh release view "$TAG" --json assets --jq '.assets[].name'
