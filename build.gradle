import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// ---------------------------------------------------------------------------
// versions.json drives everything: module list, dependency versions, Java
// levels, artifact names, generated metadata, CI matrix and docs.
// ---------------------------------------------------------------------------
def versionsJson = new JsonSlurper().parse(file('versions.json'))

// Read by common/build.gradle and gradle/fabric-version-module.gradle.
ext {
    modVersion = versionsJson.modVersion
    versionSpecs = versionsJson.versions
}

allprojects {
    group = 'com.commandapi'
}

// Captured as locals: task configuration blocks do not see the project's extra
// properties through a bare `ext`.
def specs = versionsJson.versions
def modVersionValue = versionsJson.modVersion
def outputDir = layout.buildDirectory.dir('distributions')

/** The version modules, in versions.json order. */
def versionProjects = { specs.keySet().collect { project(":versions:${it}") } }

/** Artifact file name for a target, e.g. commandapi-1.1.0+mc1.16.1.jar */
def artifactNameOf = { String minecraft -> "commandapi-${modVersionValue}+mc${minecraft}.jar" }

tasks.register('collectArtifacts') {
    group = 'build'
    description = 'Copies every remapped production JAR into build/distributions and writes manifest.json.'

    dependsOn versionProjects().collect { "${it.path}:remapJar" }

    doLast {
        def target = outputDir.get().asFile
        target.mkdirs()

        def artifacts = []
        specs.each { id, spec ->
            def remapJar = project(":versions:${id}").tasks.named('remapJar').get()
            def source = remapJar.archiveFile.get().asFile
            if (!source.exists()) {
                throw new GradleException("Minecraft ${spec.minecraft}: expected ${source} but it was not produced.")
            }
            def expected = artifactNameOf(spec.minecraft)
            if (source.name != expected) {
                throw new GradleException("Minecraft ${spec.minecraft}: produced ${source.name}, expected ${expected}.")
            }
            copy {
                from source
                into target
            }
            artifacts << [
                    minecraft : spec.minecraft,
                    java      : spec.java,
                    loader    : spec.loader,
                    fabricApi : spec.fabricApi,
                    file      : expected,
                    size      : source.length()
            ]
        }

        def manifest = [
                modVersion: modVersionValue,
                generated : new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC')),
                artifacts : artifacts
        ]
        new File(target, 'manifest.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n'

        artifacts.each { println "Minecraft ${it.minecraft} ... SUCCESS" }
        println "\nArtifacts:"
        artifacts.each { println "  ${target}/${it.file}" }
    }
}

tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Builds every Minecraft target declared in versions.json and collects the artifacts.'

    dependsOn versionProjects().collect { "${it.path}:build" }
    dependsOn 'collectArtifacts'
    dependsOn ':common:test'

    doLast {
        println "\nCommand API ${modVersionValue}: built ${specs.size()} Minecraft target(s)."
        println "Run './gradlew versionTable' to refresh the generated tables."
    }
}

tasks.register('versionTable', Exec) {
    group = 'documentation'
    description = 'Regenerates docs/VERSIONS.md and the README version table from versions.json + manifest.json.'
    // The tables must describe artifacts the build actually produced.
    dependsOn 'collectArtifacts'
    commandLine 'python3', file('scripts/generate-version-table.py').absolutePath
    workingDir projectDir
}

tasks.register('verifyBuilds', Exec) {
    group = 'verification'
    description = 'Verifies the collected artifacts against versions.json.'
    dependsOn 'collectArtifacts'
    commandLine 'python3', file('scripts/verify-builds.py').absolutePath
    workingDir projectDir
}

tasks.register('printVersions') {
    group = 'help'
    description = 'Prints the configured Minecraft targets.'
    doLast {
        specs.each { id, spec ->
            println "${id}\tjava=${spec.java}\tloader=${spec.loader}\tfabric-api=${spec.fabricApi}\tmodule=:${spec.module}"
        }
    }
}
