plugins {
    id 'fabric-loom'
}

def minecraft_version = project.findProperty('minecraft_version') ?: '1.19.4'
def yarn_mappings = project.findProperty('yarn_mappings') ?: '1.19.4+build.8'
def loader_version = project.findProperty('loader_version') ?: '0.14.21'
def fabric_version = project.findProperty('fabric_version') ?: '0.87.2+1.19.4'

println "Building for Minecraft ${minecraft_version} with Fabric Loader ${loader_version}"

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    mavenCentral()
}

dependencies {
    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    
    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    
    // Minecraft
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Use official mappings for stability
    mappings loom.officialMojangMappings()
    
    // SLF4J for logging
    implementation 'org.slf4j:slf4j-api:1.7.36'
    
    // JSON for config
    implementation 'com.google.code.gson:gson:2.10.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

processResources {
    inputs.property 'version', project.version
    
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
