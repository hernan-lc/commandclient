// Shared build logic for every versions/<minecraft-version> module.
//
// A version module owns no Java source and no dependency versions of its own.
// Everything comes from its entry in versions.json plus the build family and
// adapter family that entry names, so adding a Minecraft target is a
// configuration change. See docs/ADDING_VERSION.md.

def manifest = rootProject.ext.manifest
def spec = manifest.versions[project.name]
if (spec == null) {
    throw new GradleException("No entry for '${project.name}' in versions.json. See docs/ADDING_VERSION.md.")
}

def family = manifest.buildFamilies[spec.buildFamily]
if (family == null) {
    throw new GradleException("${project.name}: unknown buildFamily '${spec.buildFamily}'. " +
            "Known: ${manifest.buildFamilies.keySet()}")
}

// commandapi-<mod-version>+mc<minecraft-version>.jar
version = "${manifest.modVersion}+mc${spec.minecraft}"
base {
    archivesName = 'commandapi'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

// The families differ in how mods are consumed: the remapped pipeline needs
// modImplementation so Loom remaps them, while the unobfuscated pipeline takes
// plain dependencies because there is nothing to remap.
def modConfiguration = family.modDependencyConfiguration

dependencies {
    minecraft "com.mojang:minecraft:${spec.minecraft}"

    if (family.mappings == 'official-mojang') {
        mappings loom.officialMojangMappings()
    } else if (family.mappings != 'none') {
        throw new GradleException("${project.name}: unsupported mappings mode '${family.mappings}'")
    }
    // 'none' is not an omission: from 26.1 Mojang publishes no mappings at all,
    // and asking Loom for them in a non-obfuscated environment is an error.

    add(modConfiguration, "net.fabricmc:fabric-loader:${spec.loader}")

    // Minecraft ships Gson; compile against it without bundling it.
    compileOnly "com.google.code.gson:gson:${manifest.sharedLibraries.gson}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Shared code: the version independent core, the Fabric entrypoint (identical
// for every target), and the adapter family for this Minecraft generation.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file('adapters/loader-entrypoint/src/main/java')

if (spec.adapterFamily == 'custom') {
    // The module supplies its own MinecraftBridgeImpl under versions/<id>/src,
    // plus its own commandapi.mixins.json under versions/<id>/src/main/resources
    // (picked up as a standard resource dir) when it needs chat commands.
    if (!file('src/main/java').directory) {
        throw new GradleException("${project.name} declares adapterFamily 'custom' but has no src/main/java.")
    }
} else {
    def adapter = manifest.adapterFamilies[spec.adapterFamily]
    if (adapter == null) {
        throw new GradleException("${project.name}: unknown adapterFamily '${spec.adapterFamily}'. " +
                "Known: ${manifest.adapterFamilies.keySet()} (or 'custom')")
    }
    sourceSets.main.java.srcDir rootProject.file("${adapter.sourceDir}/src/main/java")
    // The family mixin config (commandapi.mixins.json) for /commandapi chat
    // commands. The file name is identical in every family on purpose: only
    // one family is ever on a module's classpath.
    def adapterResources = rootProject.file("${adapter.sourceDir}/src/main/resources")
    if (adapterResources.directory) {
        sourceSets.main.resources.srcDir adapterResources
    }
}

// fabric.mod.json is one shared template expanded per target.
sourceSets.main.resources.srcDir rootProject.file('templates')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(spec.buildJava as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Bytecode level this Minecraft version requires, independent of the JDK
    // that compiles it.
    options.release = spec.java as int
}

tasks.named('processResources') {
    def placeholders = [
            mod_id           : 'commandapi',
            mod_version      : project.version.toString(),
            minecraft_version: spec.minecraft.toString(),
            loader_version   : spec.loader.toString(),
            java_version     : spec.java.toString()
    ]
    inputs.properties placeholders
    filesMatching('fabric.mod.json') {
        expand placeholders
    }
}

// Which task produces the shippable JAR is family specific: the remapped
// pipeline ships remapJar, the unobfuscated one has no remap step at all and
// ships jar. Expose it so the root project never has to assume.
ext.productionJarTask = family.productionJarTask
tasks.register('productionJar') {
    group = 'build'
    description = "Alias for this module's production JAR task (${family.productionJarTask})."
    dependsOn family.productionJarTask
}

// Native API capabilities are explicit compatibility metadata, never inferred from names.
def nativeSources = layout.buildDirectory.dir('generated/sources/native')
sourceSets.main.java.srcDir nativeSources
tasks.register('generateNativeCommands') {
    inputs.property('nativeCapabilities', spec.native)
    inputs.file(rootProject.file('templates/NativeCommands.java.template'))
    outputs.dir nativeSources
    doLast {
        def capability = spec.native
        if (!(capability.permissions in ['numeric', 'set']) || !(capability.callback in ['brigadier', 'result']) ||
                !(capability.entrypoint in ['performCommand', 'performPrefixedCommand']))
            throw new GradleException("Invalid native capabilities for ${project.name}")
        def properties = [
            permission: capability.permissions == 'set' ? 'net.minecraft.server.permissions.PermissionSet.ALL_PERMISSIONS' : '4',
            callback: capability.callback == 'brigadier' ? '(context, success, value) -> feedback.record(success, value)' : '(success, value) -> feedback.record(success, value)',
            execute: capability.entrypoint == 'performCommand' ? 'performCommand(source, text.substring(1))' : 'performPrefixedCommand(source, text)'
        ]
        copy {
            from rootProject.file('templates/NativeCommands.java.template')
            into new File(nativeSources.get().asFile, 'com/commandapi/version')
            rename { 'NativeCommands.java' }
            expand properties
        }
    }
}
tasks.named('compileJava') { dependsOn 'generateNativeCommands' }

def networkSources = layout.buildDirectory.dir('generated/sources/network')
sourceSets.main.java.srcDir networkSources
tasks.register('generateNetworking') {
    inputs.property('networkCapabilities', spec.network)
    inputs.files(rootProject.fileTree('templates') { include '*Payload*.template', 'ClientNetworking.java.template', 'CommandApiDisconnectMixin.java.template' })
    outputs.dir networkSources
    doLast {
        def n = spec.network
        if (!(n.payload in ['legacy', 'typed', 'codec']) || !(n.identifier in ['ResourceLocation', 'Identifier']))
            throw new GradleException("Invalid networking capabilities for ${project.name}")
        def idType = "net.minecraft.resources.${n.identifier}"
        def factory = n.identifierFactory == 'constructor' ? "new ${idType}(channel)" : "${idType}.${n.identifierFactory == 'parse' ? 'parse(channel)' : 'fromNamespaceAndPath(channel.split(":", 2)[0], channel.split(":", 2)[1])'}"
        def legacy = n.payload == 'legacy'
        def packet = legacy ? 'net.minecraft.network.protocol.game.ClientboundCustomPayloadPacket' : 'net.minecraft.network.protocol.common.ClientboundCustomPayloadPacket'
        def properties = [disconnectMethod: n.disconnectMethod, identifier: n.identifier, factory: factory, payloadImport: legacy ? "" : "import com.commandapi.version.BridgePayload;",
            send: legacy ? "client.player.connection.send(new net.minecraft.network.protocol.game.ServerboundCustomPayloadPacket(${factory}, new net.minecraft.network.FriendlyByteBuf(io.netty.buffer.Unpooled.wrappedBuffer(bytes))));" : 'client.player.connection.send(new net.minecraft.network.protocol.common.ServerboundCustomPayloadPacket(new BridgePayload(channel, bytes)));',
            listener: legacy ? 'net.minecraft.client.multiplayer.ClientPacketListener' : 'net.minecraft.client.multiplayer.ClientCommonPacketListenerImpl',
            packet: packet, packetDescriptor: packet.replace('.', '/'),
            receive: legacy ? '''if (!packet.getIdentifier().toString().equals("commandapi:bridge")) return;
        net.minecraft.network.FriendlyByteBuf buffer = packet.getData();
        try {
            if (buffer.readableBytes() <= com.commandapi.protocol.BridgeProtocol.MAX_BYTES) {
                byte[] bytes = new byte[buffer.readableBytes()]; buffer.readBytes(bytes); ClientNetworking.receive(this, bytes);
            }
        } finally { buffer.release(); }
        ci.cancel();''' : '''if (!(packet.payload() instanceof BridgePayload)) return;
        ClientNetworking.receive(this, ((BridgePayload)packet.payload()).bytes); ci.cancel();''',
            payloadMethods: n.payload == 'typed' ? '''public void write(FriendlyByteBuf buffer) { buffer.writeBytes(bytes); }
    public net.minecraft.resources.ResourceLocation id() { return identifier; }''' : '''public net.minecraft.network.protocol.common.custom.CustomPacketPayload.Type<BridgePayload> type() {
        return new net.minecraft.network.protocol.common.custom.CustomPacketPayload.Type<>(identifier);
    }'''
        ]
        def templates = ['ClientNetworking', 'CommandApiPayloadMixin', 'CommandApiDisconnectMixin']
        if (!legacy) templates.add('BridgePayload')
        if (n.payload == 'codec') templates.add('CommandApiPayloadCodecMixin')
        if (n.payload == 'typed') templates.add('CommandApiTypedPayloadMixin')
        templates.each { name ->
            copy {
                from rootProject.file("templates/${name}.java.template")
                into new File(networkSources.get().asFile, name.contains('Mixin') ? 'com/commandapi/version/mixin' : 'com/commandapi/version')
                rename { "${name}.java" }
                expand properties
            }
        }
    }
}
tasks.named('compileJava') { dependsOn 'generateNetworking' }

tasks.named('processResources') {
    inputs.property('networkCapabilities', spec.network)
    dependsOn 'generateNetworking'
    exclude 'commandapi.mixins.json'
    doLast {
        def base = new groovy.json.JsonSlurper().parse(rootProject.file("${manifest.adapterFamilies[spec.adapterFamily].sourceDir}/src/main/resources/commandapi.mixins.json"))
        if (spec.network.payload == 'codec') base.compatibilityLevel = 'JAVA_17'
        base.client.add('CommandApiPayloadMixin')
        base.client.add('CommandApiDisconnectMixin')
        if (spec.network.payload == 'codec') base.client.add('CommandApiPayloadCodecMixin')
        if (spec.network.payload == 'typed') base.client.add('CommandApiTypedPayloadMixin')
        new File(destinationDir, 'commandapi.mixins.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(base)) + '\n'
    }
}
