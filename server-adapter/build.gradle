plugins { id 'java' }
version = rootProject.ext.modVersion
base { archivesName = 'commandapi-server' }
repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}
dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.1-R0.1-SNAPSHOT'
    implementation project(':common')
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
// Bukkit/Minecraft provides Gson. Bundle only our shared core; no server API or duplicate Gson.
tasks.named('jar') {
    dependsOn ':common:classes'
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') { expand(version: project.version) }
}
dependencies {
    testImplementation 'org.spigotmc:spigot-api:1.21.1-R0.1-SNAPSHOT'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    dependsOn 'jar'
    useJUnitPlatform()
    systemProperty 'commandapi.pluginJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}
tasks.register('verifyPlugin', Exec) {
    dependsOn 'jar'
    commandLine 'python3', rootProject.file('scripts/verify-plugin.py').absolutePath, tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}
tasks.named('check') { dependsOn 'verifyPlugin' }
