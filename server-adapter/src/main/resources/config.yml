host: 127.0.0.1
port: 0
# Generated on first startup. Authentication is always enabled.
token: ''
# player preserves the selected player's permissions and location.
# console explicitly grants the API server-console authority.
sender: player
player-uuid: ''

# Empty denies command execution until an administrator selects roots (or '*').
allowed-commands: []
# Empty permits any otherwise authorized player. UUID strings only.
allowed-players: []
