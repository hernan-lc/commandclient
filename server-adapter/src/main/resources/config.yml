# Optional independent administrator HTTP API. Client integration does not use this token.
http-enabled: false
host: 127.0.0.1
port: 0
token: ''
allow-remote-privileged: false
sender: player
player-uuid: ''
console-enabled: false
# Exact root names, including namespaces. Empty denies all; '*' is an explicit broad grant.
allowed-commands: []
allowed-players: []
commands-per-tick: 8
max-jobs: 128
max-queued-commands: 1024
retention-seconds: 600
http-workers: 4
max-http-queue: 32
execution-timeout-seconds: 30
